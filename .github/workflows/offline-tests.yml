name: Offline acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: offline shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q app tests
      - run: python -m app.selfcheck
      - run: python tools/ci_pytest_shard.py --index ${{ matrix.shard }} --count 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-shard-${{ matrix.shard }}
          path: |
            data/ci-shard-*-manifest.json
            data/ci-shard-*.xml
          if-no-files-found: error
