[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "playerok-control-center"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["aiogram>=3.31,<4", "aiohttp>=3.14,<4", "aiohttp-socks>=0.10,<0.12", "python-socks[asyncio]>=2.7,<3", "httpx>=0.28,<1", "python-dotenv>=1.1,<2", "Pillow>=12,<14", "matplotlib>=3.10,<4", "requests>=2.32.5,<3", "curl-cffi>=0.13,<1", "wrapper-tls-requests>=1.2.5,<2", "websocket-client>=1.8,<2", "Telethon==1.45.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
pcc = "app.__main__:main"
pcc-check = "app.selfcheck:main"

[tool.setuptools.packages.find]
include = ["app*", "playerokapi*"]

[tool.setuptools.package-data]
playerokapi = ["cacert.pem"]
"app.database" = ["schema.sql", "migrations/*.sql"]
"app.gifts" = ["catalog.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["playerokapi", ".vendor", ".venv"]
